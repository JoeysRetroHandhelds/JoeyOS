# Keeps the RetroAchievements romhack index current (tools/build_rapatches.py), publishing it to
# this repo's `data` branch, which the app's romhack tool reads from raw.githubusercontent.com.
#
# Every 15 minutes it asks whether RAPatches has a new commit (one cheap `git ls-remote`) and stops
# there when it hasn't. When it has, the build is incremental: archives already read are known by
# their git blob sha from the formats cache kept on the data branch, so only new or changed ones
# are read, and the No-Intro dats come from the Actions cache. The data branch is replaced with a
# single commit each time, so nothing builds up in history, and `master` is never touched.
name: Romhack index comparison (temporary)

on:
  push:
    branches: [fix-7z-format]
    paths: [".github/workflows/romhack-compare.yml"]

permissions:
  contents: read

concurrency:
  group: romhack-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # each git call below passes its own header

      - name: Has RAPatches changed?
        id: source
        run: |
          # The token goes in a header rather than the remote URL, so it never lands in git's
          # config or output.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          head=$(git ls-remote https://github.com/RetroAchievements/RAPatches.git refs/heads/main | cut -f1)
          # An empty or odd answer (network trouble) would otherwise look "changed" and be recorded;
          # it's also used in later commands, so only a plain commit hash is accepted.
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "Couldn't read RAPatches' head commit."; exit 1; }
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if git -c http.extraheader="$auth" ls-remote --exit-code --heads "$remote" data >/dev/null 2>&1; then
            git -c http.extraheader="$auth" clone --quiet --depth 1 --branch data "$remote" current
          fi
          built=$(cat current/source-commit 2>/dev/null || true)
          # A push to the builder, a manual run or a new RAPatches commit rebuilds; otherwise stop.
          if [ "$head" = "$built" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "RAPatches unchanged since the last build ($head)."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Which week is it
        if: steps.source.outputs.build == 'true'
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the No-Intro dats
        if: steps.source.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: tools/.cache
          # Fetched fresh once a week and reused by every run in between: they change rarely, and
          # a week-old one only misses brand-new dumps. Each run saves under its own key, restoring
          # the week's latest, so a dat one run failed to fetch is kept once a later run gets it.
          key: nointro-${{ steps.week.outputs.week }}-${{ github.run_id }}
          restore-keys: nointro-${{ steps.week.outputs.week }}-

      - name: Build the index
        if: steps.source.outputs.build == 'true'
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
        run: |
          mkdir -p out/cache
          if [ "${{ inputs.full }}" != "true" ] && [ -f current/cache/formats.json ]; then
            cp current/cache/formats.json out/cache/formats.json
          fi
          # RetroAchievements game lookups are kept even on a full rebuild: an ID's game never changes.
          if [ -f current/cache/ra-games.json ]; then cp current/cache/ra-games.json out/cache/ra-games.json; fi
          pip install --quiet py7zr
          python3 tools/build_rapatches.py --out out/ra-patches --formats-cache out/cache/formats.json | tee build.log
          echo "${{ steps.source.outputs.head }}" > out/source-commit

      - name: Compare with the live index
        if: always()
        run: |
          cat > compare.py <<'PY'
          import json, glob, os
          def load(root):
              out = {}
              for f in glob.glob(root + "/ra-patches/*.json"):
                  c = os.path.basename(f)[:-5]
                  if c == "master" or c.endswith(".ids"): continue
                  d = json.load(open(f, encoding="utf-8"))
                  if not isinstance(d, dict): continue
                  for crc, es in d.items():
                      if not isinstance(es, list): continue
                      for e in es:
                          if not isinstance(e, dict): continue
                          out[(c, crc, e["path"])] = e
              return out
          old, new = load("current"), {}
          new = load("out")
          ch = [(k, old[k]["format"], new[k]["format"], new[k]["name"]) for k in old if k in new and old[k]["format"] != new[k]["format"]]
          print("format changed rows", len(ch), "hacks", len({k[2] for k, *_ in ch}))
          lost = sorted(set(old) - set(new)); added = sorted(set(new) - set(old))
          print("old", len(old), "new", len(new), "lost", len(lost), "added", len(added))
          with open("compare.tsv", "w", encoding="utf-8") as o:
              for tag, keys, src in (("LOST", lost, old), ("ADDED", added, new)):
                  for k in keys:
                      e = src[k]
                      o.write(chr(9).join([tag, k[0], k[1], e.get("format", ""), e.get("name", ""), k[2]]) + chr(10))
          PY
          python3 compare.py
          head -c 60000 compare.tsv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: romhack-compare
          path: |
            compare.tsv
            build.log
          retention-days: 3
